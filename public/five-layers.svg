<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="556" viewBox="0 0 1180 556" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
<rect width="1180" height="556" fill="#FFFFFF"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748B"/></marker></defs>
<text x="36" y="42" font-size="21" font-weight="700" fill="#0F172A">TeaRAGs — five layers of one index</text>
<text x="36" y="66" font-size="13.5" fill="#64748B">what the agent gets back for every question, whatever runs inside</text>
<rect x="430.0" y="86" width="320" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="590.0" y="108" font-size="14" font-weight="700" text-anchor="middle" fill="#0F172A">AI coding agent</text>
<text x="590.0" y="125" font-size="11.5" text-anchor="middle" fill="#64748B">asks one question in plain language</text>
<line x1="590.0" y1="136" x2="590.0" y2="160" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="36" y="164" width="1108" height="36" rx="8" fill="#A07D1C"/>
<text x="590.0" y="187" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">one MCP interface · skills that know which layer a task needs</text>
<line x1="366.0" y1="200" x2="366.0" y2="214" stroke="#A07D1C" stroke-width="1.6"/>
<path d="M40,238 L40,230 L692,230 L692,238" fill="none" stroke="#A07D1C" stroke-width="1.4"/>
<rect x="156.39999999999998" y="214" width="419.20000000000005" height="20" fill="#FFFFFF"/>
<text x="366.0" y="228" font-size="12" font-weight="600" text-anchor="middle" fill="#A07D1C">read the code — what it does, how it connects, how it has lived</text>
<line x1="926.0" y1="200" x2="926.0" y2="214" stroke="#A07D1C" stroke-width="1.6"/>
<path d="M712,238 L712,230 L1140,230 L1140,238" fill="none" stroke="#A07D1C" stroke-width="1.4"/>
<rect x="790.0" y="214" width="272.0" height="20" fill="#FFFFFF"/>
<text x="926.0" y="228" font-size="12" font-weight="600" text-anchor="middle" fill="#A07D1C">judge its interfaces — borders and names</text>
<rect x="36" y="250" width="212" height="222" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="142.0" y="272" font-size="10.5" font-weight="700" text-anchor="middle" fill="#64748B">LAYER 1</text>
<text x="142.0" y="294" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">Semantic index</text>
<text x="142.0" y="318" font-size="12" font-weight="700" text-anchor="middle" fill="#A07D1C">What does this code do?</text>
<circle cx="52" cy="344" r="2.2" fill="#64748B"/>
<text x="60" y="348" font-size="11.5" fill="#0F172A">AST chunks, not N lines</text>
<circle cx="52" cy="366" r="2.2" fill="#64748B"/>
<text x="60" y="370" font-size="11.5" fill="#0F172A">dense + BM25 hybrid search</text>
<circle cx="52" cy="388" r="2.2" fill="#64748B"/>
<text x="60" y="392" font-size="11.5" fill="#0F172A">find by meaning, not by name</text>
<text x="142.0" y="442" font-size="11.5" font-style="italic" text-anchor="middle" fill="#64748B">«where do we prorate</text>
<text x="142.0" y="458" font-size="11.5" font-style="italic" text-anchor="middle" fill="#64748B">a plan upgrade?»</text>
<rect x="260" y="250" width="212" height="222" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="366.0" y="272" font-size="10.5" font-weight="700" text-anchor="middle" fill="#64748B">LAYER 2</text>
<text x="366.0" y="294" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">Codegraph</text>
<text x="366.0" y="318" font-size="12" font-weight="700" text-anchor="middle" fill="#A07D1C">How is it connected?</text>
<circle cx="276" cy="344" r="2.2" fill="#64748B"/>
<text x="284" y="348" font-size="11.5" fill="#0F172A">symbols + resolved calls</text>
<circle cx="276" cy="366" r="2.2" fill="#64748B"/>
<text x="284" y="370" font-size="11.5" fill="#0F172A">callers · callees · paths</text>
<circle cx="276" cy="388" r="2.2" fill="#64748B"/>
<text x="284" y="392" font-size="11.5" fill="#0F172A">ambiguous ≠ guessed</text>
<text x="366.0" y="442" font-size="11.5" font-style="italic" text-anchor="middle" fill="#64748B">«who calls this, and what</text>
<text x="366.0" y="458" font-size="11.5" font-style="italic" text-anchor="middle" fill="#64748B">will my change break?»</text>
<rect x="484" y="250" width="212" height="222" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="590.0" y="272" font-size="10.5" font-weight="700" text-anchor="middle" fill="#64748B">LAYER 3</text>
<text x="590.0" y="294" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">Trajectory</text>
<text x="590.0" y="318" font-size="12" font-weight="700" text-anchor="middle" fill="#A07D1C">How has it lived?</text>
<circle cx="500" cy="344" r="2.2" fill="#64748B"/>
<text x="508" y="348" font-size="11.5" fill="#0F172A">churn · bug fixes · owners</text>
<circle cx="500" cy="366" r="2.2" fill="#64748B"/>
<text x="508" y="370" font-size="11.5" fill="#0F172A">fanIn · PageRank · blast radius</text>
<circle cx="500" cy="388" r="2.2" fill="#64748B"/>
<text x="508" y="392" font-size="11.5" fill="#0F172A">labels from your percentiles</text>
<text x="590.0" y="442" font-size="11.5" font-style="italic" text-anchor="middle" fill="#64748B">«what gets fixed every</text>
<text x="590.0" y="458" font-size="11.5" font-style="italic" text-anchor="middle" fill="#64748B">sprint, and whose is it?»</text>
<rect x="708" y="250" width="212" height="222" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="814.0" y="272" font-size="10.5" font-weight="700" text-anchor="middle" fill="#64748B">LAYER 4</text>
<text x="814.0" y="294" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">Architecture</text>
<text x="814.0" y="318" font-size="12" font-weight="700" text-anchor="middle" fill="#A07D1C">Is it laid out right?</text>
<circle cx="724" cy="344" r="2.2" fill="#64748B"/>
<text x="732" y="348" font-size="11.5" fill="#0F172A">stable → unstable deps</text>
<circle cx="724" cy="366" r="2.2" fill="#64748B"/>
<text x="732" y="370" font-size="11.5" fill="#0F172A">imports past a facade</text>
<circle cx="724" cy="388" r="2.2" fill="#64748B"/>
<text x="732" y="392" font-size="11.5" fill="#0F172A">co-change with no edge</text>
<circle cx="724" cy="410" r="2.2" fill="#64748B"/>
<text x="732" y="414" font-size="11.5" fill="#0F172A">main-sequence distance</text>
<text x="814.0" y="442" font-size="11.5" font-style="italic" text-anchor="middle" fill="#64748B">«which module border</text>
<text x="814.0" y="458" font-size="11.5" font-style="italic" text-anchor="middle" fill="#64748B">is drawn wrong?»</text>
<rect x="932" y="250" width="212" height="222" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="1038.0" y="272" font-size="10.5" font-weight="700" text-anchor="middle" fill="#64748B">LAYER 5</text>
<text x="1038.0" y="294" font-size="16" font-weight="700" text-anchor="middle" fill="#0F172A">Lexicon</text>
<text x="1038.0" y="318" font-size="12" font-weight="700" text-anchor="middle" fill="#A07D1C">What does the project call it?</text>
<circle cx="948" cy="344" r="2.2" fill="#64748B"/>
<text x="956" y="348" font-size="11.5" fill="#0F172A">how values of a type are named</text>
<circle cx="948" cy="366" r="2.2" fill="#64748B"/>
<text x="956" y="370" font-size="11.5" fill="#0F172A">role word per directory</text>
<circle cx="948" cy="388" r="2.2" fill="#64748B"/>
<text x="956" y="392" font-size="11.5" fill="#0F172A">synonyms · homonyms · outliers</text>
<circle cx="948" cy="410" r="2.2" fill="#64748B"/>
<text x="956" y="414" font-size="11.5" fill="#0F172A">a verdict on every new name</text>
<text x="1038.0" y="442" font-size="11.5" font-style="italic" text-anchor="middle" fill="#64748B">«do my new names speak</text>
<text x="1038.0" y="458" font-size="11.5" font-style="italic" text-anchor="middle" fill="#64748B">the project's language?»</text>
<rect x="36" y="490" width="1108" height="36" rx="8" fill="#FBF6E4" stroke="#A07D1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="590.0" y="513" font-size="13" text-anchor="middle" fill="#A07D1C">a dossier for every result: code + structure + history + ranking overlay · 100% local</text>
</svg>