[package]
name = "tearags-rust-callsites"
version = "0.1.0"
edition = "2024"
publish = false
description = "rustc driver: per call site, the compiler-resolved callee as NDJSON (tea-rags codegraph)"

[package.metadata.rust-analyzer]
rustc_private = true

[lib]
name = "tearags_rust_callsites"
path = "src/lib.rs"

# cargo-side CLI: runs `cargo check` with the driver as RUSTC_WORKSPACE_WRAPPER.
[[bin]]
name = "tearags-rust-callsites"
path = "src/bin/tearags-rust-callsites.rs"

# The RUSTC_WORKSPACE_WRAPPER itself; the CLI looks it up next to its own executable.
[[bin]]
name = "tearags-rust-callsites-driver"
path = "src/bin/tearags-rust-callsites-driver.rs"

[dependencies]
rustc_plugin = "=0.15.2-nightly-2026-05-01"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
rustc_plugin = "=0.15.2-nightly-2026-05-01"

# The fixture under tests/fixtures/workspace is its own workspace; never a member of this one.
[workspace]
