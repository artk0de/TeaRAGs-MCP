name: Release

on:
  # Gate the release on CI. This workflow runs only AFTER the CI workflow
  # completes for a push to main; the jobs below additionally require
  # conclusion == 'success', so a red CI pipeline yields no npm publish and no
  # GitHub release post. NOTE: workflow_run always uses the workflow file from
  # the default branch, so this gate only takes effect once merged to main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  pages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Publish only when CI is green (conclusion == 'success'). Also skip
    # semantic-release's own `chore(release):` version commit AND the
    # declarative-changelog bot's `chore(release): … declarative changelog`
    # follow-up (release-changelog.yml). The latter intentionally lands here so
    # deploy-docs redeploys the website with the declarative notes.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)') }}
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Sync with remote main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Type check scripts
        run: npm run type-check:scripts

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test -- --run --reporter=dot

      - name: Run provider verification tests
        run: npm run test:providers

      - name: Verify npm token
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm whoami --registry https://registry.npmjs.org/
          rm .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    # Deploy docs only when CI is green. When release ran, wait for it; when the
    # release job was skipped (a chore(release) commit), still redeploy the site.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      !failure() && !cancelled() }}
    needs: release
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install docs dependencies
        working-directory: website
        run: npm ci

      - name: Build docs
        working-directory: website
        run: npm run build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── Prebuilt rustc call-site driver ────────────────────────────────────
  # `tea-rags rustc-driver install` (and the npm postinstall) download the
  # archive for their platform from the release of their own version, keyed by
  # the toolchain pin and the driver's sourceHash. The jobs below run only when
  # `release` tagged the head of main.
  rustc-driver-version:
    name: Resolve rustc driver release
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.result == 'success' }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      pin: ${{ steps.resolve.outputs.pin }}
      source-hash: ${{ steps.resolve.outputs.source-hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve version, pin and sourceHash
        id: resolve
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          if [ -z "$tag" ]; then
            echo "No release tag on HEAD - nothing to build"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pin=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' native/tea-rags-rustc-driver/rust-toolchain.toml)
          hash=$(npx tsx -e 'import { computeRustcDriverSourceHash, defaultRustcDriverSourceFs } from "./src/core/adapters/rustc-driver/driver-build.ts"; process.stdout.write(computeRustcDriverSourceHash("native/tea-rags-rustc-driver", defaultRustcDriverSourceFs));')
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "source-hash=$hash" >> "$GITHUB_OUTPUT"

  rustc-driver-build:
    name: Build rustc driver (${{ matrix.platform }})
    needs: rustc-driver-version
    if: ${{ needs.rustc-driver-version.outputs.version != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      PIN: ${{ needs.rustc-driver-version.outputs.pin }}
      SOURCE_HASH: ${{ needs.rustc-driver-version.outputs.source-hash }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.rustc-driver-version.outputs.version }}

      - name: Install pinned nightly
        run: rustup toolchain install "$PIN" --profile minimal -c rustc-dev,rust-src,llvm-tools-preview

      - name: Build driver
        working-directory: native/tea-rags-rustc-driver
        run: RUSTUP_TOOLCHAIN="$PIN" cargo build --release --locked

      - name: Archive driver
        run: |
          ext=""
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then ext=".exe"; fi
          release=native/tea-rags-rustc-driver/target/release
          banner=$("$release/tea-rags-rustc-driver$ext" -V)
          echo "banner: $banner"
          case "$banner" in *"$PIN $SOURCE_HASH"*) ;; *) echo "banner does not carry $PIN $SOURCE_HASH"; exit 1 ;; esac
          mkdir -p dist stage
          cp "$release/tea-rags-rustc-driver$ext" "$release/tea-rags-rustc-driver-wrapper$ext" stage/
          base="tea-rags-rustc-driver-$PIN-$SOURCE_HASH-${{ matrix.platform }}"
          if [ -n "$ext" ]; then
            asset="$base.zip"
            (cd stage && 7z a -tzip "../dist/$asset" .)
          else
            asset="$base.tar.gz"
            tar -czf "dist/$asset" -C stage .
          fi
          if command -v sha256sum > /dev/null; then sum=$(sha256sum "dist/$asset"); else sum=$(shasum -a 256 "dist/$asset"); fi
          echo "${sum%% *}" > "dist/$asset.sha256"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: rustc-driver-${{ matrix.platform }}
          path: dist/

  rustc-driver-smoke:
    name: Smoke rustc driver (${{ matrix.platform }})
    needs: [rustc-driver-version, rustc-driver-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            triple: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            triple: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - platform: windows-x64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      PIN: ${{ needs.rustc-driver-version.outputs.pin }}
      SOURCE_HASH: ${{ needs.rustc-driver-version.outputs.source-hash }}
    steps:
      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: rustc-driver-${{ matrix.platform }}
          path: dist

      # The layout `tea-rags rustc-driver install` creates: a --profile minimal
      # toolchain in a private RUSTUP_HOME, the loader pointed at its libraries.
      # The build machine's rpath does not exist on a clean runner.
      - name: Run -V against a minimal toolchain
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/rust/rustup" CARGO_HOME="$RUNNER_TEMP/rust/cargo"
          rustup toolchain install "$PIN" --profile minimal
          toolchain="$RUSTUP_HOME/toolchains/$PIN-${{ matrix.triple }}"
          mkdir -p driver
          ext=""
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            ext=".exe"
            (cd driver && 7z x ../dist/*.zip)
            PATH="$(cygpath -u "$toolchain")/bin:$PATH"
            export PATH
          else
            tar -xzf dist/*.tar.gz -C driver
            export LD_LIBRARY_PATH="$toolchain/lib" DYLD_FALLBACK_LIBRARY_PATH="$toolchain/lib"
          fi
          banner=$("./driver/tea-rags-rustc-driver$ext" -V)
          echo "banner: $banner"
          case "$banner" in *"$PIN $SOURCE_HASH"*) ;; *) echo "smoke: banner does not carry $PIN $SOURCE_HASH"; exit 1 ;; esac

  rustc-driver-publish:
    name: Publish rustc driver archives
    runs-on: ubuntu-latest
    needs: [rustc-driver-version, rustc-driver-build, rustc-driver-smoke]
    env:
      VERSION: ${{ needs.rustc-driver-version.outputs.version }}
      PIN: ${{ needs.rustc-driver-version.outputs.pin }}
      SOURCE_HASH: ${{ needs.rustc-driver-version.outputs.source-hash }}
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: rustc-driver-*
          path: dist
          merge-multiple: true

      - name: Write rustc-driver-manifest.json
        run: |
          node -e '
            const fs = require("node:fs");
            const prefix = `tea-rags-rustc-driver-${process.env.PIN}-${process.env.SOURCE_HASH}-`;
            const assets = {};
            for (const file of fs.readdirSync("dist")) {
              if (!file.endsWith(".sha256")) continue;
              const asset = file.slice(0, -".sha256".length);
              const platform = asset.slice(prefix.length).replace(/\.(tar\.gz|zip)$/, "");
              assets[platform] = { asset, sha256: fs.readFileSync(`dist/${file}`, "utf8").trim() };
            }
            const manifest = { pin: process.env.PIN, sourceHash: process.env.SOURCE_HASH, assets };
            fs.writeFileSync("dist/rustc-driver-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
            console.log(JSON.stringify(manifest, null, 2));
          '

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release upload "v$VERSION" dist/*.tar.gz dist/*.zip dist/rustc-driver-manifest.json \
            --repo "${{ github.repository }}" --clobber
