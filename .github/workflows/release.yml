name: Release

on:
  # Gate the release on CI. This workflow runs only AFTER the CI workflow
  # completes for a push to main; the jobs below additionally require
  # conclusion == 'success', so a red CI pipeline yields no npm publish and no
  # GitHub release post. NOTE: workflow_run always uses the workflow file from
  # the default branch, so this gate only takes effect once merged to main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  pages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Publish only when CI is green (conclusion == 'success'). Also skip
    # semantic-release's own `chore(release):` version commit AND the
    # declarative-changelog bot's `chore(release): … declarative changelog`
    # follow-up (release-changelog.yml). The latter intentionally lands here so
    # deploy-docs redeploys the website with the declarative notes.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)') }}
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Sync with remote main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test -- --run --reporter=dot

      - name: Run provider verification tests
        run: npm run test:providers

      - name: Verify npm token
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm whoami --registry https://registry.npmjs.org/
          rm .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    # Deploy docs only when CI is green. When release ran, wait for it; when the
    # release job was skipped (a chore(release) commit), still redeploy the site.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      !failure() && !cancelled() }}
    needs: release
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install docs dependencies
        working-directory: website
        run: npm ci

      - name: Build docs
        working-directory: website
        run: npm run build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
