name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # semantic-release's version commit and the declarative-changelog follow-up
  # (`chore(release): …`) touch only package.json, the lockfile version and the
  # changelogs, so the full matrix (~20 min × 2) re-proves a tree CI already
  # proved one commit earlier. CI must still CONCLUDE `success` for them:
  # release.yml runs on workflow_run and its deploy-docs job redeploys the site
  # with the declarative notes only on a green CI. A run whose every job is
  # skipped concludes `skipped`, so this cheap job stands in for the matrix.
  release-bookkeeping:
    name: Release bookkeeping commit
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "chore(release) commit — build and test skipped; CI proved the tree on the previous commit."

  build-and-test:
    name: Build and Test
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release)')) }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Pre-fetch node-gyp headers (avoid ETIMEDOUT during npm ci)
        run: |
          for i in 1 2 3; do
            npx node-gyp install && break
            echo "Retry $i: node-gyp install failed, retrying..."
            sleep 5
          done

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --quiet

      - name: Type check
        run: npm run type-check

      - name: Type check scripts
        run: npm run type-check:scripts

      - name: Build project
        run: npm run build

      - name: Run tests with coverage (quality gate)
        # `default` reporter (not `dot`): dot goes silent during the ~90s v8
        # coverage-report generation on the runner, which reads as a hang and
        # masks a plain threshold miss. default keeps printing per-file so the
        # real exit reason (e.g. "ERROR: Coverage … does not meet threshold") is
        # never buried. See bd tea-rags-mcp-rytq3.
        run: npm run test:coverage -- --reporter=default
        # Note: This step enforces coverage thresholds via vitest.config.ts
        # If thresholds are not met, this step will fail with exit code 1

      - name: Run provider verification tests
        run: npm run test:providers

      - name: Quality Gate - Verify coverage reports
        run: |
          if [ ! -f coverage/coverage-final.json ]; then
            echo "❌ ERROR: Coverage report not generated"
            exit 1
          fi
          echo "✅ Coverage report generated successfully"
          echo ""
          echo "📊 Quality Gate Status:"
          echo "  Required: statements ≥ 90%, lines ≥ 90%, functions ≥ 90%, branches ≥ 80%"
          echo "  Note: Vitest enforces thresholds automatically"
          echo "  If you see this message, coverage thresholds were met ✅"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: true
