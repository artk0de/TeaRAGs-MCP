name: Declarative Changelog

# Post-processes a published release: a Claude agent on a cloud runner groups
# commits by conventional scope (+ subject) into a declarative changelog, then
# rewrites the GitHub release notes (declarative + full commits spoiler) and the
# changelog files (declarative only + inline hash links). No tea-rags / semantic
# search — the project's conventional-commit scopes carry the grouping signal.
# Runs AFTER semantic-release has published — never competes with it.

on:
  release:
    types: [published]
  # Manual trigger for testing on an existing tag without waiting for a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)generate notes for, e.g. v1.29.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-changelog
  cancel-in-progress: false

jobs:
  declarative-changelog:
    name: Declarative Changelog
    # Resolves from the release event OR the manual workflow_dispatch input.
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Compute commit range
        id: range
        run: |
          CURR="${{ env.TAG }}"
          PREV=$(git describe --tags --abbrev=0 "${CURR}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then RANGE="${PREV}..${CURR}"; else RANGE="$CURR"; fi
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Build commits.json
        run: |
          git log --no-merges --format='%H%x1f%s%x1f%an%x1f%ae%x1f%b%x1e' ${{ steps.range.outputs.range }} \
            | node scripts/git-log-to-json.js > commits.json

      # Git only carries the name the committing machine was configured with, so
      # a contributor lands in the credits as bare text. GitHub knows the account
      # behind each commit — ask it, and the credits become `@handle` links.
      - name: Resolve contributor GitHub handles
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: node scripts/resolve-author-handles.js commits.json > author-handles.json

      # claude-code-action@v1 only handles issue/PR/comment events ("Unsupported
      # event type: release"), so we drive the headless CLI directly. The OAuth
      # token authorizes the subscription — no Anthropic API key needed.
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate declarative notes (agent)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "Read scripts/release-changelog-prompt.md and follow it exactly. Version is ${TAG} without the leading v. The file commits.json holds this release's commits. Write release-notes.json to the working directory." \
            --allowedTools "Read,Write"

      # Blog posts are written BY HAND; git says which ones this release ships.
      # A post ADDED inside the release's commit range is that release's
      # article, and both artifacts link it under the version header. A range
      # that added none yields `[]` and renders nothing.
      # The very first release has no previous tag, so `range` is a bare ref —
      # `git diff` against it would compare the tag to the working tree instead
      # of to a predecessor, so that case contributes no posts.
      - name: Build blog-posts.json
        run: |
          RANGE='${{ steps.range.outputs.range }}'
          case "$RANGE" in
            *..*) git diff --diff-filter=A --name-only "$RANGE" -- website/blog ;;
            *) printf '' ;;
          esac | node scripts/blog-posts-to-json.js > blog-posts.json

      - name: Build artifacts
        run: node scripts/build-changelog-artifacts.js

      - name: Mirror to website
        run: bash scripts/prepare-changelog.sh

      # The README list is generated from whatever posts are on disk, so it picks
      # up every hand-written post merged since the last release ran this.
      - name: Refresh README blog index
        run: node scripts/update-readme-blog-index.js

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh release edit "${{ env.TAG }}" --notes-file release-notes.md

      - name: Commit declarative changelog
        run: |
          git config user.name "tea-rags-bot"
          git config user.email "bot@tea-rags"
          # README.md carries the generated "From the blog" block, refreshed
          # above. website/blog itself is hand-written — nothing here writes it.
          git add CHANGELOG.md website/docs/changelog.md README.md
          # `chore(release):` prefix → release.yml skips its release job (guard)
          # while deploy-docs (if: always) redeploys the website. See release.yml.
          git commit -m "chore(release): ${{ env.TAG }} declarative changelog" || exit 0
          git push origin main
